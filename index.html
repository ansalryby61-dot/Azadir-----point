<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شركة أزادير - نظام الجوائز والنقاط</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #d97706; /* لون ذهبي احترافي لشركة أزادير */
      --accent-hover: #b45309;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      direction: rtl;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      background: var(--card);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
    }

    .company-header {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f1f5f9;
    }

    .company-title {
      font-size: 26px;
      font-weight: 900;
      color: var(--primary);
      margin: 0;
      letter-spacing: -0.5px;
    }

    .company-subtitle {
      font-size: 13px;
      color: var(--accent);
      font-weight: 700;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: #f1f5f9;
      padding: 5px;
      border-radius: 12px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      border-radius: 9px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      color: #64748b;
      transition: all 0.3s ease;
    }

    .tab.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.15);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #475569;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 15px;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #1e293b;
    }

    .btn-claim {
      background-color: var(--danger);
      margin-top: 15px;
    }

    .btn-claim:hover {
      background-color: var(--danger-hover);
    }

    .card {
      background: linear-gradient(135deg, #f8fafc 0%, #edf2f7 100%);
      border: 1px solid #cbd5e1;
      padding: 18px;
      border-radius: 14px;
      margin-top: 20px;
    }

    .prize-box {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
      margin-top: 12px;
      font-size: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 13px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 10px 8px;
      text-align: center;
    }

    th {
      background: var(--primary);
      color: white;
      font-weight: 600;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="company-header">
    <div class="company-title">شركة أزادير</div>
    <div class="company-subtitle">نظام النقاط والمكافآت المباشر</div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('client')">استعلام زبون</div>
    <div class="tab" onclick="switchTab('admin')">إضافة فاتورة جديدة</div>
  </div>

  <!-- قسم استعلام الزبون -->
  <div id="client-view">
    <div class="form-group">
      <label>أدخل رقم الهاتف للبحث عن الحساب:</label>
      <input type="tel" id="search-phone" placeholder="09XXXXXXXX">
    </div>
    <button class="btn" onclick="searchCustomer()">بحث عن البيانات</button>

    <div id="customer-result" class="hidden">
      <div class="card">
        <h3 id="res-name" style="margin:0 0 10px 0; color:var(--primary);"></h3>
        <div>إجمالي المشتريات: <strong id="res-total-amount">0</strong> د.ل</div>
        <div>مجموع النقاط: <strong id="res-total-points">0</strong> نقطة</div>
        <div class="prize-box" id="res-prize">لا توجد جائزة حالياً</div>
        
        <!-- زر استلام الجائزة وتصفر النقاط -->
        <button class="btn btn-claim" onclick="claimPrize()">أوافق على سحب الجائزة وتصفير النقاط</button>
      </div>

      <h4 style="margin-top:20px; margin-bottom:8px">سجل الفواتير المسجلة:</h4>
      <table>
        <thead>
          <tr>
            <th>رقم المستند</th>
            <th>القيمة</th>
            <th>النقاط</th>
          </tr>
        </thead>
        <tbody id="invoices-list"></tbody>
      </table>
    </div>
  </div>

  <!-- قسم إضافة الفواتير (الإدارة) -->
  <div id="admin-view" class="hidden">
    <form id="invoice-form" onsubmit="saveInvoice(event)">
      <div class="form-group">
        <label>رقم مستند الفاتورة (يمنع التكرار):</label>
        <input type="text" id="doc-id" placeholder="مثلاً: 1001" required>
      </div>
      <div class="form-group">
        <label>اسم الزبون الرباعي:</label>
        <input type="text" id="cust-name" placeholder="أدخل الاسم" required>
      </div>
      <div class="form-group">
        <label>رقم الهاتف:</label>
        <input type="tel" id="cust-phone" placeholder="09XXXXXXXX" required>
      </div>
      <div class="form-group">
        <label>قيمة الفاتورة (بالدينار):</label>
        <input type="number" id="inv-amount" min="1" placeholder="مثلاً: 5000" required>
      </div>
      <button type="submit" class="btn" style="background-color: var(--accent);">حفظ الفاتورة وإضافة النقاط</button>
    </form>
  </div>
</div>

<script>
  let currentActivePhone = "";

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if(tab === 'client') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('client-view').classList.remove('hidden');
      document.getElementById('admin-view').classList.add('hidden');
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('admin-view').classList.remove('hidden');
      document.getElementById('client-view').classList.add('hidden');
    }
  }

  // جدول تحديد الهدايا بناء على مجموع قيمة المشتريات بالدينار
  function getPrizeByAmount(totalAmount) {
    if (totalAmount >= 350000) return "🎁 هلتي شحن";
    if (totalAmount >= 90000)  return "🎁 هلتي عادي";
    if (totalAmount >= 85000)  return "🎁 تربلو شحن 20 مجموعة";
    if (totalAmount >= 75000)  return "🎁 تربلو شحن 18 مجموعة";
    if (totalAmount >= 70000)  return "🎁 تربلو شحن 12 مجموعة";
    if (totalAmount >= 60000)  return "🎁 جلخ";
    if (totalAmount >= 50000)  return "🎁 ترابلو عادي";
    if (totalAmount >= 40000)  return "🎁 بلاور";
    if (totalAmount >= 35000)  return "🎁 شفاط زجاج";
    if (totalAmount >= 25000)  return "🎁 صندوق عدة";
    if (totalAmount >= 20000)  return "🎁 ماكينة برشام";
    if (totalAmount >= 9000)   return "🎁 ماكينة سيلكون";
    if (totalAmount >= 5000)   return "🎁 متر قياس";
    if (totalAmount >= 3800)   return "🎁 مسمار عادي";
    if (totalAmount >= 3500)   return "🎁 مسمار رأس بونتة";
    if (totalAmount >= 3000)   return "🎁 مفك / مسمار تركيب";
    return "لا توجد جائزة حالياً (تستحق أول جائزة عند الوصول لمشتريات بقيمة 3000 دينار)";
  }

  function getStoredInvoices() {
    return JSON.parse(localStorage.getItem('azadir_invoices_db') || '[]');
  }

  function saveInvoice(e) {
    e.preventDefault();

    const docId = document.getElementById('doc-id').value.trim();
    const name = document.getElementById('cust-name').value.trim();
    const phone = document.getElementById('cust-phone').value.trim();
    const amount = Number(document.getElementById('inv-amount').value);
    const points = Math.floor(amount / 100);

    const invoices = getStoredInvoices();

    // التحقق من عدم تكرار رقم المستند
    const isDuplicate = invoices.some(inv => inv.docId === docId);
    if (isDuplicate) {
      alert("❌ خطأ: رقم مستند الفاتورة هذا مسجل سابقاً! يرجى إدخال رقم مستند مختلف.");
      return;
    }

    invoices.push({ docId, name, phone, amount, points });
    localStorage.setItem('azadir_invoices_db', JSON.stringify(invoices));

    alert("✅ تم حفظ الفاتورة بنجاح وإضافة النقاط لشركة أزادير!");
    document.getElementById('invoice-form').reset();
  }

  function searchCustomer() {
    const phone = document.getElementById('search-phone').value.trim();
    if (!phone) {
      alert("يرجى إدخال رقم الهاتف.");
      return;
    }

    currentActivePhone = phone;
    const invoices = getStoredInvoices();
    const userInvoices = invoices.filter(inv => inv.phone === phone);

    if (userInvoices.length === 0) {
      alert("لم يتم العثور على أي فواتير مسجلة بهذا الرقم في شركة أزادير.");
      document.getElementById('customer-result').classList.add('hidden');
      return;
    }

    let totalAmount = 0;
    let totalPoints = 0;
    let name = userInvoices[0].name;

    const tbody = document.getElementById('invoices-list');
    tbody.innerHTML = '';

    userInvoices.forEach(inv => {
      totalAmount += inv.amount;
      totalPoints += inv.points;
      tbody.innerHTML += `
        <tr>
          <td>#${inv.docId}</td>
          <td>${inv.amount.toLocaleString()} د.ل</td>
          <td>${inv.points}</td>
        </tr>
      `;
    });

    document.getElementById('res-name').innerText = "الزبون: " + name;
    document.getElementById('res-total-amount').innerText = totalAmount.toLocaleString();
    document.getElementById('res-total-points').innerText = totalPoints.toLocaleString();
    document.getElementById('res-prize').innerText = getPrizeByAmount(totalAmount);

    document.getElementById('customer-result').classList.remove('hidden');
  }

  // سحب الجائزة وتصفير بيانات ورصيد الزبون
  function claimPrize() {
    if (!currentActivePhone) return;

    const confirmAction = confirm("هل أنت تأكد من تسليم الجائزة للزبون؟ سيؤدي هذا الإجراء إلى حذف جميع فواتير الزبون وتصفير نقاطه نهائياً.");
    if (confirmAction) {
      let invoices = getStoredInvoices();
      // حذف كافة الفواتير المتعلقة بهذا الرقم
      invoices = invoices.filter(inv => inv.phone !== currentActivePhone);
      localStorage.setItem('azadir_invoices_db', JSON.stringify(invoices));

      alert("🎉 تم سحب الجائزة وتصفير النقاط وسجل الفواتير بنجاح!");
      document.getElementById('customer-result').classList.add('hidden');
      document.getElementById('search-phone').value = '';
    }
  }
</script>

</body>
</html>
