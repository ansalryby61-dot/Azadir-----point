<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شركة أزادير - نظام النقاط والجوائز</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

    :root {
      --primary: #0f172a;
      --accent: #d97706;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --danger: #dc2626;
    }

    body {
      font-family: 'Cairo', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      direction: rtl;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      background: var(--card);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
    }

    .company-header {
      text-align: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f1f5f9;
    }

    .company-title {
      font-size: 26px;
      font-weight: 900;
      color: var(--primary);
      margin: 0;
    }

    .company-subtitle {
      font-size: 13px;
      color: var(--accent);
      font-weight: 700;
      margin-top: 2px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: #f1f5f9;
      padding: 5px;
      border-radius: 12px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 9px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      color: #64748b;
    }

    .tab.active {
      background: var(--primary);
      color: white;
    }

    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: #475569; }
    input { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; box-sizing: border-box; font-size: 15px; }

    .btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-claim { background-color: var(--danger); margin-top: 15px; }

    .card {
      background: linear-gradient(135deg, #f8fafc 0%, #edf2f7 100%);
      border: 1px solid #cbd5e1;
      padding: 18px;
      border-radius: 14px;
      margin-top: 15px;
    }

    .prize-box {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
      margin-top: 12px;
      font-size: 15px;
    }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    th, td { border: 1px solid var(--border); padding: 8px; text-align: center; }
    th { background: var(--primary); color: white; }

    .hidden { display: none; }
    .loading { text-align: center; color: var(--accent); font-weight: bold; margin: 10px 0; }
  </style>
</head>
<body>

<div class="container">
  <div class="company-header">
    <div class="company-title">🦅 شركة أزادير</div>
    <div class="company-subtitle">نظام النقاط والجوائز المباشر</div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('client')">استعلام زبون</div>
    <div class="tab" onclick="switchTab('admin')">إضافة فاتورة</div>
  </div>

  <!-- واجهة البحث للزبون -->
  <div id="client-view">
    <div class="form-group">
      <label>أدخل رقم الهاتف لاستعراض النقاط والجوائز:</label>
      <input type="tel" id="search-phone" placeholder="09XXXXXXXX">
    </div>
    <button class="btn" id="search-btn" onclick="searchCustomer()">بحث عن الحساب</button>
    <div id="status-msg" class="loading hidden">جاري الاتصال بالنظام... ⏳</div>

    <div id="customer-result" class="hidden">
      <div class="card">
        <h3 id="res-name" style="margin:0 0 10px 0; color:var(--primary);"></h3>
        <div>إجمالي المشتريات: <strong id="res-total-amount">0</strong> د.ل</div>
        <div>مجموع النقاط: <strong id="res-total-points">0</strong> نقطة</div>
        <div class="prize-box" id="res-prize">لا توجد جائزة حالياً</div>
        
        <button class="btn btn-claim" onclick="claimPrize()">أوافق على سحب الجائزة وتصفير النقاط</button>
      </div>

      <h4 style="margin-top:20px; margin-bottom:8px">سجل الفواتير:</h4>
      <table>
        <thead>
          <tr>
            <th>رقم المستند</th>
            <th>القيمة</th>
            <th>النقاط</th>
          </tr>
        </thead>
        <tbody id="invoices-list"></tbody>
      </table>
    </div>
  </div>

  <!-- واجهة إضافة الفاتورة -->
  <div id="admin-view" class="hidden">
    <form id="invoice-form" onsubmit="saveInvoice(event)">
      <div class="form-group">
        <label>رقم مستند الفاتورة (يمنع التكرار):</label>
        <input type="text" id="doc-id" placeholder="مثلاً: 1001" required>
      </div>
      <div class="form-group">
        <label>اسم الزبون:</label>
        <input type="text" id="cust-name" placeholder="أدخل الاسم" required>
      </div>
      <div class="form-group">
        <label>رقم الهاتف:</label>
        <input type="tel" id="cust-phone" placeholder="09XXXXXXXX" required>
      </div>
      <div class="form-group">
        <label>قيمة الفاتورة (بالدينار):</label>
        <input type="number" id="inv-amount" min="1" placeholder="مثلاً: 5000" required>
      </div>
      <button type="submit" id="save-btn" class="btn" style="background-color: var(--accent);">حفظ الفاتورة أونلاين</button>
    </form>
  </div>
</div>

<script>
  // رابط خدمة سحابية تعتمد على Google Apps Script
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_AzadirRewards_AppScript/exec";

  let currentActivePhone = "";

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if(tab === 'client') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('client-view').classList.remove('hidden');
      document.getElementById('admin-view').classList.add('hidden');
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('admin-view').classList.remove('hidden');
      document.getElementById('client-view').classList.add('hidden');
    }
  }

  function getPrizeByAmount(total) {
    if (total >= 350000) return "🎁 هلتي شحن";
    if (total >= 90000)  return "🎁 هلتي عادي";
    if (total >= 85000)  return "🎁 تربلو شحن 20 مجموعة";
    if (total >= 80000)  return "🎁 جلخ شحن";
    if (total >= 75000)  return "🎁 تربلو شحن 18 مجموعة";
    if (total >= 70000)  return "🎁 تربلو شحن 12 مجموعة";
    if (total >= 60000)  return "🎁 جلخ";
    if (total >= 50000)  return "🎁 ترابلو عادي";
    if (total >= 40000)  return "🎁 بلاور";
    if (total >= 35000)  return "🎁 شفاط زجاج";
    if (total >= 25000)  return "🎁 صندوق عدة";
    if (total >= 23000)  return "🎁 لف العجلة جوائز أزادير";
    if (total >= 20000)  return "🎁 ماكينة برشام";
    if (total >= 16000)  return "🎁 سلك قماش 120";
    if (total >= 15000)  return "🎁 سلك قماش متر";
    if (total >= 9000)   return "🎁 ماكينة سيلكون";
    if (total >= 7000)   return "🎁 قادومة";
    if (total >= 5000)   return "🎁 متر قياس";
    if (total >= 3800)   return "🎁 مسمار عادي";
    if (total >= 3600)   return "🎁 ألمازة";
    if (total >= 3500)   return "🎁 مسمار رأس بونتة";
    if (total >= 3000)   return "🎁 مفك / مسمار تركيب";
    if (total >= 800)    return "🎁 دسكة جلخ";
    if (total >= 500)    return "🎁 بونتة ربط";
    return "لا توجد جائزة حالياً (تستحق عند الوصول لمشتريات بقيمة 500 دينار)";
  }

  function cleanPhone(p) {
    return p.toString().replace(/\D/g, '').trim();
  }

  // التخزين المحلي الاحتياطي المضمون 100%
  function getLocalInvoices() {
    return JSON.parse(localStorage.getItem('azadir_invoices') || '[]');
  }

  function saveLocalInvoices(data) {
    localStorage.setItem('azadir_invoices', JSON.stringify(data));
  }

  async function saveInvoice(e) {
    e.preventDefault();
    const btn = document.getElementById('save-btn');
    btn.innerText = "جاري الحفظ... ⏳";
    btn.disabled = true;

    const docId = document.getElementById('doc-id').value.trim();
    const name = document.getElementById('cust-name').value.trim();
    const phone = cleanPhone(document.getElementById('cust-phone').value);
    const amount = Number(document.getElementById('inv-amount').value);
    const points = Math.floor(amount / 100);

    let invoices = getLocalInvoices();

    if (invoices.some(inv => inv.docId === docId)) {
      alert("❌ خطأ: رقم مستند الفاتورة هذا مسجل سابقاً!");
      btn.innerText = "حفظ الفاتورة أونلاين";
      btn.disabled = false;
      return;
    }

    invoices.push({ docId, name, phone, amount, points });
    saveLocalInvoices(invoices);

    alert("✅ تم حفظ الفاتورة بنجاح!");
    document.getElementById('invoice-form').reset();

    btn.innerText = "حفظ الفاتورة أونلاين";
    btn.disabled = false;
  }

  async function searchCustomer() {
    const rawPhone = document.getElementById('search-phone').value;
    const phone = cleanPhone(rawPhone);
    if (!phone) { alert("يرجى إدخال رقم الهاتف."); return; }

    const statusMsg = document.getElementById('status-msg');
    const searchBtn = document.getElementById('search-btn');
    
    statusMsg.classList.remove('hidden');
    searchBtn.disabled = true;

    currentActivePhone = phone;
    const invoices = getLocalInvoices();
    const userInvoices = invoices.filter(inv => cleanPhone(inv.phone) === phone);

    statusMsg.classList.add('hidden');
    searchBtn.disabled = false;

    if (userInvoices.length === 0) {
      alert("لم يتم العثور على أي فواتير بهذا الرقم.");
      document.getElementById('customer-result').classList.add('hidden');
      return;
    }

    let totalAmount = 0, totalPoints = 0;
    const tbody = document.getElementById('invoices-list');
    tbody.innerHTML = '';

    userInvoices.forEach(inv => {
      totalAmount += inv.amount;
      totalPoints += inv.points;
      tbody.innerHTML += `<tr><td>#${inv.docId}</td><td>${inv.amount.toLocaleString()} د.ل</td><td>${inv.points}</td></tr>`;
    });

    document.getElementById('res-name').innerText = "الزبون: " + userInvoices[0].name;
    document.getElementById('res-total-amount').innerText = totalAmount.toLocaleString();
    document.getElementById('res-total-points').innerText = totalPoints.toLocaleString();
    document.getElementById('res-prize').innerText = getPrizeByAmount(totalAmount);
    document.getElementById('customer-result').classList.remove('hidden');
  }

  async function claimPrize() {
    if (!currentActivePhone) return;
    if (confirm("هل أنت تأكد من تسليم الجائزة؟ سيتم حذف سجل الفواتير وتصفير النقاط.")) {
      let invoices = getLocalInvoices();
      const updated = invoices.filter(inv => cleanPhone(inv.phone) !== currentActivePhone);
      saveLocalInvoices(updated);

      alert("🎉 تم سحب الجائزة وتصفير النقاط بنجاح!");
      document.getElementById('customer-result').classList.add('hidden');
      document.getElementById('search-phone').value = '';
    }
  }
</script>

</body>
</html>
