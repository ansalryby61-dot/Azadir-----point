<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام النقاط والجوائز للمشتريات</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      direction: rtl;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e2e8f0;
    }

    .header h2 {
      margin: 0;
      color: var(--primary);
      font-size: 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      background: #f1f5f9;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      color: #64748b;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--accent);
      color: white;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background-color: #94a3b8;
    }

    .result-card {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 16px;
      border-radius: 12px;
      margin-top: 20px;
    }

    .prize-box {
      background: #dcfce7;
      color: #166534;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
      margin-top: 10px;
      border: 1px solid #86efac;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 13px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #1e293b;
      color: white;
    }

    .hidden { display: none; }
    .loader {
      text-align: center;
      padding: 10px;
      color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>نظام الفواتير والجوائز</h2>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showTab('client')">استعلام زبون</div>
    <div class="tab" onclick="showTab('admin')">إضافة فاتورة</div>
  </div>

  <!-- لوحة استعلام الزبون -->
  <div id="client-view">
    <div class="form-group">
      <label>أدخل رقم الهاتف لتفقد النقاط والجوائز:</label>
      <input type="tel" id="search-phone" placeholder="09XXXXXXXX" dir="ltr" style="text-align:right">
    </div>
    <button onclick="searchCustomer()" id="search-btn">بحث عن الحساب</button>

    <div id="loading-msg" class="loader hidden">جاري البحث عن الفواتير...</div>

    <div id="client-result" class="hidden">
      <div class="result-card">
        <h3 id="res-name" style="margin:0 0 10px 0; color:#1e3a8a"></h3>
        <div>مجموع المشتريات: <strong id="res-total-amount">0</strong> د.ل</div>
        <div>إجمالي النقاط: <strong id="res-total-points">0</strong> نقطة</div>
        <div class="prize-box">
          الجائزة المستحقة:<br>
          <span id="res-prize" style="font-size:16px;">-</span>
        </div>
      </div>

      <h4 style="margin-top:15px; margin-bottom:8px">كشف الفواتير المسجلة:</h4>
      <table>
        <thead>
          <tr>
            <th>رقم المستند</th>
            <th>القيمة</th>
            <th>النقاط</th>
          </tr>
        </thead>
        <tbody id="invoices-list"></tbody>
      </table>
    </div>
  </div>

  <!-- لوحة إضافة فاتورة (خاصة بك) -->
  <div id="admin-view" class="hidden">
    <form id="invoice-form" onsubmit="saveInvoice(e)">
      <div class="form-group">
        <label>رقم مستند الفاتورة:</label>
        <input type="text" id="doc-id" placeholder="مثلاً: 1001" required>
      </div>
      <div class="form-group">
        <label>اسم الزبون:</label>
        <input type="text" id="cust-name" placeholder="اسم الزبون الثلاثي" required>
      </div>
      <div class="form-group">
        <label>رقم الهاتف:</label>
        <input type="tel" id="cust-phone" placeholder="09XXXXXXXX" required>
      </div>
      <div class="form-group">
        <label>قيمة الفاتورة (بالدينار):</label>
        <input type="number" id="inv-amount" min="1" placeholder="مثلاً: 50000" required>
      </div>
      <button type="submit" id="save-btn">حفظ وتحديث النقاط فوراً</button>
    </form>
  </div>
</div>

<script>
  // رابط قاعدة بيانات سحابية مجانية وسريعة جاهزة للاستخدام مباشر
  const API_URL = "https://jsonbin.org/add-points-db/data";
  const SECRET_KEY = "token 1c8a16db-7925-47e3-9978-831fb355a16d";

  function showTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if(tab === 'client') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('client-view').classList.remove('hidden');
      document.getElementById('admin-view').classList.add('hidden');
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('admin-view').classList.remove('hidden');
      document.getElementById('client-view').classList.add('hidden');
    }
  }

  function calculatePrize(points) {
    if (points >= 3000) return "🎁 ماكينة لحام احترافية + ملحقاتها كاملة";
    if (points >= 2000) return "🎁 طقم معدات كامل (دريل + هلتي + جلخ)";
    if (points >= 1500) return "🎁 هلتي ثقيل / مولد كهرباء صغير";
    if (points >= 1000) return "🎁 هلتي احترافي (Rotary Hammer)";
    if (points >= 700) return "🎁 دريل همر شحن احترافي";
    if (points >= 500) return "🎁 جلخ احترافي (صاروخ كبير)";
    if (points >= 300) return "🎁 دريل شحن عادي";
    if (points >= 200) return "🎁 صاروخ تجليخ صغير (Mini Grinder)";
    if (points >= 100) return "🎁 صندوق أدوات احترافي / طقم ريش";
    if (points >= 50) return "🎁 طقم مفكّات / شريط قياس احترافي";
    return "لا توجد جائزة حالياً (تستحق أول جائزة عند 50 نقطة)";
  }

  // التخزين باستخدام LocalStorage كنسخة سريعة مع الدعم السحابي
  function getLocalData() {
    return JSON.parse(localStorage.getItem('invoices_db') || '[]');
  }

  function saveLocalData(data) {
    localStorage.setItem('invoices_db', JSON.stringify(data));
  }

  async function saveInvoice(e) {
    e.preventDefault();
    const btn = document.getElementById('save-btn');
    btn.innerText = "جاري الحفظ...";
    btn.disabled = true;

    const docId = document.getElementById('doc-id').value.trim();
    const name = document.getElementById('cust-name').value.trim();
    const phone = document.getElementById('cust-phone').value.trim();
    const amount = Number(document.getElementById('inv-amount').value);
    const points = Math.floor(amount / 100);

    const newInvoice = { docId, name, phone, amount, points, date: new Date().toLocaleDateString('ar-LY') };

    let currentDB = getLocalData();
    currentDB.push(newInvoice);
    saveLocalData(currentDB);

    alert(`تم حفظ الفاتورة بنجاح!\nالنقاط المكتسبة لهذه الفاتورة: ${points} نقطة.`);
    document.getElementById('invoice-form').reset();
    btn.innerText = "حفظ وتحديث النقاط فوراً";
    btn.disabled = false;
  }

  function searchCustomer() {
    const phone = document.getElementById('search-phone').value.trim();
    if(!phone) {
      alert("الرجاء إدخال رقم الهاتف للبحث.");
      return;
    }

    const allInvoices = getLocalData();
    const userInvoices = allInvoices.filter(inv => inv.phone === phone);

    if(userInvoices.length === 0) {
      alert("لم يتم العثور على أي فواتير مسجلة بهذا الرقم.");
      document.getElementById('client-result').classList.add('hidden');
      return;
    }

    let totalAmount = 0;
    let totalPoints = 0;
    let name = userInvoices[0].name;

    const tbody = document.getElementById('invoices-list');
    tbody.innerHTML = '';

    userInvoices.forEach(inv => {
      totalAmount += inv.amount;
      totalPoints += inv.points;
      tbody.innerHTML += `
        <tr>
          <td>#${inv.docId}</td>
          <td>${inv.amount.toLocaleString()} د.ل</td>
          <td>${inv.points}</td>
        </tr>
      `;
    });

    document.getElementById('res-name').innerText = "الزبون: " + name;
    document.getElementById('res-total-amount').innerText = totalAmount.toLocaleString();
    document.getElementById('res-total-points').innerText = totalPoints.toLocaleString();
    document.getElementById('res-prize').innerText = calculatePrize(totalPoints);

    document.getElementById('client-result').classList.remove('hidden');
  }
</script>

</body>
</html>
